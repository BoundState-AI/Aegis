repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: npm run lint
        language: system
        pass_filenames: false

      - id: tsc-noemit
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
