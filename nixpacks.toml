# Force Python provider for Railway
providers = ["python"]

# Ensure virtual environment is created and pip is available
[phases.setup]
cmds = ["python3 -m venv /opt/venv"]

# Force pip to use requirements.txt instead of pyproject.toml
# (pyproject.toml has local dependency boundstate-core that can't be resolved from PyPI)
[phases.install]
cmds = ["/opt/venv/bin/pip install --no-cache-dir -r requirements.txt"]

# Use venv Python for running the app
[start]
cmd = "/opt/venv/bin/python -m uvicorn boundstate_aegis.api:app --host 0.0.0.0 --port ${PORT:-8002}"

