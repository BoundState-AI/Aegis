    source_id: THERMO_PTFE
    polymer: PTFE
    stress_mode: thermal oxidative
    pfas_product: TFA
    yield_pct: null
    temperature_c: null
    oxygen_pct: 21
    mechanism: "thermolysis in air (not incineration) → perhalogenated acids"
    confidence: high
    page: 2
    text_fragment: "The incineration, or combustion, of fluoropolymers has previously been proposed as a source of TFA and CDFA. These processes differ from thermolysis in that a source of fuel is used in order to purposefully evoke complete decomposition. Furthermore, it is unlikely to yield environmentally significant levels of TFA, or TFA precursors, due to the high temperatures and oxidizing conditions used, which would result in the cleavage of most carbon–fluorine bonds."
    notes: "Clarifies that thermolysis (heating in air) differs from incineration and produces TFA"

