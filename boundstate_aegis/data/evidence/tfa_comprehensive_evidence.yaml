academic_research:
  - id: CAHILL_2022_TFA_INCREASE
    title: "6-Fold TFA Concentration Increase Over 23 Years"
    source: "PMC/Environmental Science & Technology"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9261931/"
    pmc_id: "PMC9261931"
    year: 2022

    methodology:
      sites: 50
      locations: ["Northern California (45)", "Interior Alaska (5)"]
      comparison_period: "1998 vs 2021"
      method: "Headspace gas chromatography-mass spectrometry"
      detection_limit: "19.5 ng/L"

    key_findings:
      overall_increase:
        finding: "TFA concentrations increased 6-fold average over 23 years"
        2021_median: "180 ng/L"
        2021_range: "21.3-2,790 ng/L"
        confidence: 0.95

      regional_increases:
        - region: "East San Francisco Bay"
          increase: "10.7x"
        - region: "Interior Alaska"
          increase: "8.7x"
        - region: "Upwind Coastal Streams"
          increase: "7.2x"
        - region: "West Slope Sierra Nevada"
          increase: "6.9x"
        - region: "Sierra Nevada Foothills"
          increase: "3.1x"

      hfc_correlation:
        finding: "HFC-134a atmospheric concentrations rose 14-fold (1998-2021)"
        note: "Correlates with TFA increase, though multiple sources exist"

    litigation_relevance:
      note: "Empirical proof of TFA accumulation - contradicts 'de minimis' steady-state assumptions"

  - id: COPERNICUS_ACP_TFA_DEPOSITION
    title: "TFA Deposition from HFO-1234yf Emissions"
    source: "Atmospheric Chemistry and Physics (Copernicus)"
    url: "https://acp.copernicus.org/articles/21/14833/2021/"
    year: 2021

    geographic_hotspots:
      - region: "India/Bangladesh"
        dry_deposition: "up to 2 kg/km2/yr"
        wet_deposition: ">3.5 kg/km2/yr (Himalayan foothills)"

      - region: "China"
        finding: "Southeastern regions highest combined deposition"

      - region: "Middle East"
        finding: "Northern Iran primary area; Arabian Sea receiving substantial deposits"

    deposition_fate:
      regional_retention: "25-50% deposited in source region"
      international_dispersal: "30-45%"
      oceanic_accumulation: "7-27%"

    concentration_modeling:
      rainwater_tfa_range: "0.89-7.8 ug/L"
      toxicity_threshold: "10,000 ug/L"
      conclusion: "Below no observable effect concentration"

    litigation_relevance:
      note: "Documents global TFA dispersal pathways from HFO emissions"


