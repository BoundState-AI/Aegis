unep_teap_assessments:
  - id: UNEP_TFA_2016
    title: "UNEP TFA Environmental Effects Assessment 2016"
    source: "UNEP Ozone Secretariat"
    url: "https://ozone.unep.org/sites/default/files/2019-08/TFA2016.pdf"
    year: 2016

    key_findings:
      de_minimis_conclusion:
        finding: "Risks to ecosystem and human health from TFA degradation product currently de minimis"
        basis: "Margins of Exposure (MoEs) >100 for aquatic organisms"
        timeframe: "Through at least 2100"
        confidence: 0.85
        caveat: "Based on estimated future emissions of HFCs and HFOs"

      tfa_yields:
        hfc_134a:
          yield: "7-20%"
          atmospheric_lifetime: "~14 years"

        hfo_1234yf:
          yield: "Higher yield than HFC-134a"
          note: "Degradation occurs faster with larger TFA yield"

      sensitive_species:
        finding: "Alga R. subcapitata unusually sensitive to TFA"
        note: "Other aquatic organisms relatively insensitive"

    limitations_noted:
      - "Persistence is centuries to millennia (uncertain)"
      - "Does not bioaccumulate but is extremely persistent"
      - "Based on projected emissions - actuals may differ"

    litigation_relevance:
      industry_use: "Industry frequently cites 'de minimis' conclusion"
      counter_argument: "Based on 2016 projections - TFA accumulation now documented to exceed predictions"

  - id: UNEP_EEAP_2022
    title: "UNEP Environmental Effects Assessment Panel 2022"
    source: "UNEP"
    url: "https://www.chemours.cn/-/media/files/corporate/tfa-summary-unep-eeap-2022-assessment-report-52323.pdf"
    year: 2022

    key_points:
      - "TFA salts persistent - half-life centuries to millennia"
      - "Does not bioaccumulate in food chains"
      - "Easily excreted by animals"
      - "Low toxicity to animals and plants"
      - "Wide margins between exposures and toxicity values"


