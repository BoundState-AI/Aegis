german_uba_research:
  - id: UBA_TFA_SOURCES_2023
    title: "Sources of Trifluoroacetate and Strategies to Reduce Input"
    source: "German Federal Environment Agency (UBA)"
    url: "https://www.umweltbundesamt.de/sites/default/files/medien/11850/publikationen/167_2023_texte_tfa_eng_v2.pdf"
    citation: "TEXTE 167/2023"
    year: 2023

    key_findings:
      german_tfa_emissions:
        - source: "Refrigerants and blowing agents (HFOs)"
          quantity: "~2,000 t/year"
          rank: 1
          confidence: 0.90

        - source: "Pesticides"
          quantity: "~457 t/year"
          key_compounds: ["flufenacet", "diflufenican", "fluazinam"]
          rank: 2
          confidence: 0.90

        - source: "Human pharmaceuticals"
          quantity: "~29 t/year"
          rank: 3
          confidence: 0.85

      hfo_conversion:
        finding: "HFO-1234yf undergoes 100% conversion to TFA over ~2 weeks"
        mechanism: "Photolytic conversion in atmosphere"
        confidence: 0.95

      pesticide_finding:
        finding: "Pesticides are dominant source of TFA in rural agricultural areas"
        key_pesticide: "flufenacet"
        status: "flufenacet now being banned in EU"
        confidence: 0.90

    litigation_relevance:
      note: "German government research identifies HFOs as largest quantifiable TFA source"
      chemours_exposure: "2,000 t/year German emissions attributed to refrigerants/blowing agents"

  - id: UBA_BFR_CLP_2024
    title: "German CLP Classification Proposal for TFA"
    source: "German UBA and BfR"
    url: "https://naturalrefrigerants.com/german-chemicals-office-submits-proposal-to-eu-linking-tfa-to-reproductive-toxicity/"
    date: "July 2024"

    proposal:
      submitted_to: "ECHA"
      proposed_classifications:
        - "Reproductive toxicity (suspected damage to fertility)"
        - "Persistent, Mobile, Toxic (PMT)"
        - "very Persistent, very Mobile (vPvM)"

      consultation_period: "2025-05-26 to 2025-07-25"

    litigation_relevance:
      note: "German authorities formally linking TFA to reproductive toxicity strengthens liability case"


