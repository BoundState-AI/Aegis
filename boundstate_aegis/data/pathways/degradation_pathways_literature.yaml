  # =============================================================================
  # TFA MINERALIZATION PATHWAYS
  # Critical for EOL Tool - demonstrates TFA is DESTRUCTIBLE
  # Added 2026-01-11 for AEGIS EOL proof generation
  # =============================================================================

  TFA:
  # =============================================================================
  # VERIFIED DOIs - Web searched and confirmed 2026-01-11
  # Original DOIs were hallucinated - these are the real papers
  # =============================================================================

  - trigger: hydrothermal_alkaline
    products:
    - fluoride_ion
    - CO2
    - H2O
    confidence: 0.95
    citations:
    # VERIFIED: Austin et al. 2024 - specifically about TFA destruction
    - DOI:10.1021/acs.est.3c09404
    mechanisms:
    - hydrothermal_alkaline
    snippet: "Hydrothermal processing in compressed liquid water transforms TFA at relatively mild conditions (T = 150-250C, P < 30 MPa). Alkali amendment (NaOH) promotes mineralization of CHF3, yielding dissolved fluoride, formate, and carbonate species as final products."
    conditions:
      min_temp_c: 150
      max_temp_c: 250
      atmosphere: "aqueous_alkaline"
      residence_time_s: 1800
    evidence_refs:
    - property: destruction_efficiency
      value: "mineralization to F-, formate, carbonate"
      source: "DOI:10.1021/acs.est.3c09404"
      test_method: "hydrothermal reactor"
      date: "2024-01-01"
      confidence: 0.95
      notes: "Austin et al. 2024 - Hydrothermal Destruction and Defluorination of Trifluoroacetic Acid (TFA) - Environ. Sci. Technol."
    technology:
      name: HALT
      full_name: Hydrothermal Alkaline Treatment
      provider: Aquagga
      ip_holder: Colorado School of Mines
      trl: 7
    additional_refs:
    # Supporting HALT papers from Colorado School of Mines
    - doi: "10.1021/acs.est.2c00654"
      citation: "Hao et al. 2022 - Application of HALT for Destruction of PFAS in Contaminated Groundwater and Soil"
    - doi: "10.1021/acs.est.3c05140"
      citation: "Hao et al. 2023 - HALT of Foam Fractionation Concentrate"
    - doi: "10.1021/acsestengg.4c00378"
      citation: "Pinkard et al. 2024 - Degradation and Defluorination of Ultra Short-, Short-, and Long-Chain PFASs"

  - trigger: supercritical_water
    products:
    - fluoride_ion
    - CO2
    confidence: 0.90
    citations:
    # VERIFIED: Krause et al. 2022 - J. Environmental Engineering
    - DOI:10.1061/(ASCE)EE.1943-7870.0001957
    mechanisms:
    - supercritical_water_oxidation
    snippet: "SCWO achieved >99% reduction of total PFAS. PFOS reduced from 30.4 mg/L to 0.310 ug/L. TFA was found to be the most recalcitrant intermediate product, persisting at T=600C and residence time ~32s, emphasizing need for TFA monitoring."
    conditions:
      min_temp_c: 600
      max_temp_c: 650
      atmosphere: "supercritical_water_O2"
      residence_time_s: 32
    evidence_refs:
    - property: destruction_efficiency
      value: ">99% total PFAS, TFA recalcitrant at 600C"
      source: "DOI:10.1061/(ASCE)EE.1943-7870.0001957"
      test_method: "SCWO reactor - Aquarden, Battelle, 374Water"
      date: "2022-02-01"
      confidence: 0.90
      notes: "Krause et al. 2022 - Supercritical Water Oxidation as an Innovative Technology for PFAS Destruction - J. Environ. Eng."
    technology:
      name: SCWO
      full_name: Supercritical Water Oxidation
      providers:
      - 374Water
      - Revive Environmental
      - Aquarden
      - Battelle
      trl: 8
    additional_refs:
    - doi: "10.1016/j.jhazmat.2023.132264"
      citation: "Chiang et al. 2023 - SCWO for Destruction of Spent Media Wastes"
    - doi: "10.1016/j.cej.2022.139176"
      citation: "Pinkard et al. 2022 - PFOS destruction in continuous SCWO reactor"

  - trigger: plasma
    products:
    - fluoride_ion
    - CO2
    - TFA  # Important: plasma produces TFA as intermediate!
    confidence: 0.75
    citations:
    # VERIFIED: Singh et al. 2019 - pilot-scale plasma
    - DOI:10.1021/acs.est.9b02964
    mechanisms:
    - plasma_destruction
    snippet: "Pilot-scale plasma reactor achieved rapid PFAS degradation from contaminated groundwater. Significant concentrations of fluoride ions, inorganic carbon, and smaller organic acids (trifluoroacetic acid, acetic acid, formic acid) were identified in treated water."
    conditions:
      min_temp_c: 3000
      max_temp_c: 5000
    evidence_refs:
    - property: destruction_efficiency
      value: ">99% PFAS removal, TFA as byproduct"
      source: "DOI:10.1021/acs.est.9b02964"
      test_method: "pilot-scale plasma reactor"
      date: "2019-10-01"
      confidence: 0.75
      notes: "Singh et al. 2019 - Rapid Removal of Poly- and Perfluorinated Compounds from IDW in Pilot-Scale Plasma Reactor - Environ. Sci. Technol. WARNING: Plasma produces TFA as byproduct!"
    technology:
      name: Plasma Arc
      developers:
      - Drexel University
      - Onvector
      trl: 5
    additional_refs:
    - doi: "10.1021/acs.est.8b07031"
      citation: "Singh et al. 2019 - Breakdown Products from PFAS Degradation in Plasma - shows TFA production"
    caveats:
    - "Plasma treatment produces TFA as a byproduct - may need secondary treatment"
    - "Energy-intensive, scaling challenges remain"
    - "TRL 5 = pilot demonstration only"

