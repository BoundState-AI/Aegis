region: WESTERN
created_at: "2026-02-20"
purpose: "Approval gate for Western regulatory assertion drafting (pre-assertion source manifest)."
schema_target: "Must align with apac_regulatory_assertions.yaml at assertion build stage."
confidence_policy:
  enacted_confirmed: "0.95-1.00"
  finalized_not_yet_effective: "0.85-0.94"
  proposed_or_consultation: "0.75-0.84"
  draft_or_early_secondary: "0.60-0.74"

critical_discontinuities:
  - id: US_EPA_NPDWR_DISCONTINUITY_2024_2025
    note: >
      Treat April 2024 NPDWR final rule and May 2025 partial reconsideration/update
      as separate assertions. HFPO-DA/GenX, PFHxS, PFNA status must be represented
      as in-flux when applicable; never collapse this into a single "final rule" state.
    planned_assertion_ids:
      - US_EPA_NPDWR_2024_001
      - US_EPA_NPDWR_2025_001

