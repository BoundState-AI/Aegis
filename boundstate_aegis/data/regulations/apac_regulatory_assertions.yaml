# =============================================================================
# APAC REGULATORY ASSERTIONS DATABASE
# AEGIS — Asia-Pacific PFAS & Fluoropolymer Regulatory Intelligence Layer
# Created: 2026-02-20
# Updated: 2026-02-20  (verified against primary government sources)
#
# Scope: ALL fluoropolymers and PFAS — not limited to legacy PFAS.
# Includes PTFE, PVDF, FEP, PFA, ETFE, fluoroelastomers, and all
# per-/polyfluoroalkyl substances regulated or monitored in APAC.
#
# Litigation-grade assertions for 7 APAC jurisdictions.
# Every assertion is falsifiable and cites a primary government source
# or a verified aggregator where primary is non-English-only.
#
# Schema follows tfa_regulatory_assertions.yaml.
# Confidence calibration:
#   0.95-1.00 — Enacted law, primary source confirmed, in effect
#   0.85-0.94 — Finalized but not yet effective, or enacted with minor uncertainty
#   0.75-0.84 — Proposed/consultation stage, well-sourced
#   0.60-0.74 — Draft or early-stage, secondary sources
#   Below 0.60 — Flag as LOW_CONFIDENCE
#
# SOURCE VERIFICATION:
#   - Japan MOE press release (env.go.jp): 50 ng/L, April 2026, 2734 comments
#   - NITE J-CHECK Class I list: PFOS/PFOA entries confirmed
#   - NHMRC PFAS guideline values: PFOS 8 ng/L, PFOA 200 ng/L, PFHxS 30, PFBS 1000
#   - NEA Singapore circular NEA/HS/6.6 (15 Mar 2024): AFFF ban confirmed
#   - Taiwan UL Solutions / ChemRadar: 147 PFHxS, 357 PFOA/PFOS draft, 269 PFAS draft
#   - REACH24H / CIRS Group: China third batch 29 PFAS, Sichuan DB51/3202-2024
#   - TUV Rheinland / myfssai.in: India FSSAI October 6, 2025 draft
#   - GlobalCosmeticsNews / CosmeticsDesign-Asia: Korea MFDS enacted April 1, 2022
# =============================================================================

