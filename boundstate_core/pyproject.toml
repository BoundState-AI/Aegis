[project]
name = "boundstate-core"
version = "1.0.0"
description = "BoundState Core - Shared infrastructure"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "BoundState AI", email = "engineering@boundstate.ai"}
]
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boundstate_core"]
